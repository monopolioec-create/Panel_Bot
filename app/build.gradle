plugins { id 'com.android.application' }

android {
    namespace 'com.monopoliorecords.bot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.monopoliorecords.bot'
        minSdk 24
        targetSdk 28
        versionCode 4
        versionName '0.4.0'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libwuzapi.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
