name: Build TV DIGITAL V5.0.1

on:
  push:
    branches:
      - tv-digital-v5-final-20260922
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Reconstruct V4 base
        run: |
          mkdir -p /tmp/ibo_patch
          cat ibo_ui_v2/main2.b64.01 ibo_ui_v2/main2.b64.02 ibo_ui_v2/main2.b64.03 ibo_ui_v2/main2.b64.04 ibo_ui_v2/main2.b64.05 ibo_ui_v2/main2.b64.06a ibo_ui_v2/main2.b64.07 > /tmp/main.b64
          base64 -d /tmp/main.b64 > /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java
          cat ibo_ui_v2/other2.b64.01 ibo_ui_v2/other2.b64.02 ibo_ui_v2/other2.b64.03 > /tmp/other.b64
          base64 -d /tmp/other.b64 > /tmp/other.tgz
          tar -xzf /tmp/other.tgz -C /tmp/ibo_patch
          cp /tmp/ibo_patch/AppPrefs.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/AppPrefs.java
          cp /tmp/ibo_patch/ImageLoader.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/ImageLoader.java
          cp /tmp/ibo_patch/XtreamApi.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java
          cp /tmp/ibo_patch/build.gradle ibo_independent/android/app/build.gradle
          cp /tmp/ibo_patch/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml
          cat ibo_ui_v3/v3diff.0 ibo_ui_v3/v3diff.1 ibo_ui_v3/v3diff.2 ibo_ui_v3/v3diff.3 > /tmp/v3.patch
          (cd ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo && patch -p1 < /tmp/v3.patch)
          cat ibo_v4/v4line.00 ibo_v4/v4line.01 ibo_v4/v4line.02 ibo_v4/v4line.03 > /tmp/v4.patch
          (cd ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo && patch --batch -p1 < /tmp/v4.patch || true)
          cp ibo_v4/tv_digital_icon.png ibo_independent/android/app/src/main/res/drawable/tv_digital_icon.png

      - name: Restore V5 exact source
        run: |
          MAIN=ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo
          cat ibo_v5_src/MainActivity.part00 ibo_v5_src/MainActivity.part01 ibo_v5_src/MainActivity.part02 ibo_v5_src/MainActivity.part03 ibo_v5_src/MainActivity.part04 ibo_v5_src/MainActivity.part05 ibo_v5_src/MainActivity.part06 ibo_v5_src/MainActivity.part07 ibo_v5_src/MainActivity.part08 ibo_v5_src/MainActivity.part09 ibo_v5_src/MainActivity.part10 ibo_v5_src/MainActivity.part11 > "$MAIN/MainActivity.java"
          cp ibo_v5_src/CastOptionsProvider.java "$MAIN/CastOptionsProvider.java"
          cp ibo_v5_src/build.gradle ibo_independent/android/app/build.gradle
          cp ibo_v5_src/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml
          test "$(wc -c < "$MAIN/MainActivity.java")" -eq 74686

      - name: Apply V5.0.1 fixes
        run: |
          python3 ibo_v5_src/patch_v501.py
          RES=ibo_independent/android/app/src/main/res
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi" "$RES/drawable" "$RES/values"
          cp ibo_v5_src/ic_launcher_v26.xml "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          cp ibo_v5_src/ic_launcher_legacy.xml "$RES/mipmap-anydpi/ic_launcher.xml"
          cp ibo_v5_src/tv_digital_banner.xml "$RES/drawable/tv_digital_banner.xml"
          cp ibo_v5_src/launcher_colors.xml "$RES/values/launcher_colors.xml"

      - name: Functional audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java').read_text()
          manifest=Path('ibo_independent/android/app/src/main/AndroidManifest.xml').read_text()
          gradle=Path('ibo_independent/android/app/build.gradle').read_text()
          checks={
            'horizontal startup progress':'progressBarStyleHorizontal' in m,
            'startup logo':'ImageView logo = brandLogo()' in m,
            'cast startup hardening':'GoogleApiAvailability' in m and 'private View createCastButton()' in m,
            'launcher adaptive icon':'android:icon="@mipmap/ic_launcher"' in manifest,
            'round launcher icon':'android:roundIcon="@mipmap/ic_launcher"' in manifest,
            'android tv banner':'android:banner="@drawable/tv_digital_banner"' in manifest,
            'version 5.0.1':"versionName '5.0.1'" in gradle,
          }
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if not all(checks.values()): raise SystemExit(1)
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile
        working-directory: ibo_independent/android
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build APK
        working-directory: ibo_independent/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          cp ibo_independent/android/app/build/outputs/apk/debug/app-debug.apk TV_DIGITAL_Premium_V5_0_1.apk
          unzip -t TV_DIGITAL_Premium_V5_0_1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TV_DIGITAL_Premium_V5_0_1.apk | head -20
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose TV_DIGITAL_Premium_V5_0_1.apk
          sha256sum TV_DIGITAL_Premium_V5_0_1.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TV_DIGITAL_Premium_V5_0_1_APK
          path: TV_DIGITAL_Premium_V5_0_1.apk
          if-no-files-found: error
