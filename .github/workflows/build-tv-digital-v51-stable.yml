name: Build TV DIGITAL V5.1 Stable

on:
  push:
    branches:
      - tv-digital-v51-stable2-20260922
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Reconstruct V4 dependencies
        run: |
          mkdir -p /tmp/ibo_patch
          cat ibo_ui_v2/main2.b64.01 ibo_ui_v2/main2.b64.02 ibo_ui_v2/main2.b64.03 ibo_ui_v2/main2.b64.04 ibo_ui_v2/main2.b64.05 ibo_ui_v2/main2.b64.06a ibo_ui_v2/main2.b64.07 > /tmp/main.b64
          base64 -d /tmp/main.b64 > /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java
          cat ibo_ui_v2/other2.b64.01 ibo_ui_v2/other2.b64.02 ibo_ui_v2/other2.b64.03 > /tmp/other.b64
          base64 -d /tmp/other.b64 > /tmp/other.tgz
          tar -xzf /tmp/other.tgz -C /tmp/ibo_patch
          cp /tmp/ibo_patch/AppPrefs.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/AppPrefs.java
          cp /tmp/ibo_patch/ImageLoader.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/ImageLoader.java
          cp /tmp/ibo_patch/XtreamApi.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java
          cp /tmp/ibo_patch/build.gradle ibo_independent/android/app/build.gradle
          cp /tmp/ibo_patch/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml
          cat ibo_ui_v3/v3diff.0 ibo_ui_v3/v3diff.1 ibo_ui_v3/v3diff.2 ibo_ui_v3/v3diff.3 > /tmp/v3.patch
          (cd ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo && patch -p1 < /tmp/v3.patch)
          cat ibo_v4/v4line.00 ibo_v4/v4line.01 ibo_v4/v4line.02 ibo_v4/v4line.03 > /tmp/v4.patch
          (cd ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo && patch --batch -p1 < /tmp/v4.patch || true)
          cp ibo_v4/tv_digital_icon.png ibo_independent/android/app/src/main/res/drawable/tv_digital_icon.png

      - name: Apply exact V5 source
        run: |
          MAIN=ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo
          cat ibo_v5_src/MainActivity.part00 ibo_v5_src/MainActivity.part01 ibo_v5_src/MainActivity.part02 ibo_v5_src/MainActivity.part03 ibo_v5_src/MainActivity.part04 ibo_v5_src/MainActivity.part05 ibo_v5_src/MainActivity.part06 ibo_v5_src/MainActivity.part07 ibo_v5_src/MainActivity.part08 ibo_v5_src/MainActivity.part09 ibo_v5_src/MainActivity.part10 ibo_v5_src/MainActivity.part11 > "$MAIN/MainActivity.java"

      - name: Stabilize startup and redesign loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java')
          s=p.read_text()

          # Remove eager Google Cast framework imports; casting becomes a safe, on-demand system action.
          for line in [
              'import androidx.mediarouter.app.MediaRouteButton;\n',
              'import com.google.android.gms.cast.MediaInfo;\n',
              'import com.google.android.gms.cast.MediaMetadata;\n',
              'import com.google.android.gms.cast.framework.CastButtonFactory;\n',
              'import com.google.android.gms.cast.framework.CastContext;\n',
              'import com.google.android.gms.cast.framework.CastSession;\n',
              'import com.google.android.gms.cast.framework.media.RemoteMediaClient;\n',
              'import com.google.android.gms.cast.MediaLoadRequestData;\n',
          ]:
              s=s.replace(line,'')

          s=s.replace('private EditText searchBox;\n    private int heroGeneration = 0;',
                      'private EditText searchBox;\n    private ProgressBar startupProgress;\n    private TextView startupProgressText;\n    private int heroGeneration = 0;')

          s=s.replace('MediaRouteButton castButton = createCastButton();','View castButton = createCastButton();')

          old='''            ProgressBar p = new ProgressBar(this);
            box.addView(p, new LinearLayout.LayoutParams(dp(42), dp(42)));
            root.addView(box, new FrameLayout.LayoutParams(-1, -1));'''
          new='''            startupProgress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
            startupProgress.setMax(100);
            startupProgress.setProgress(8);
            startupProgress.setIndeterminate(false);
            LinearLayout.LayoutParams barLp = new LinearLayout.LayoutParams(dp(430), dp(12));
            barLp.topMargin = dp(8);
            box.addView(startupProgress, barLp);
            startupProgressText = tv(t("Preparando TV DIGITAL…", "Preparing TV DIGITAL…") + "  8%", 14, MUTED, false);
            startupProgressText.setGravity(Gravity.CENTER);
            box.addView(startupProgressText, new LinearLayout.LayoutParams(-1, dp(42)));
            root.addView(box, new FrameLayout.LayoutParams(-1, -1));'''
          if old not in s: raise SystemExit('activation progress block not found')
          s=s.replace(old,new)

          old_method=re.search(r'    private void preloadCatalogAndShowHome\(\) \{.*?\n    \}\n\n    private List<XtreamApi.Category> cachedCategories',s,re.S)
          if not old_method: raise SystemExit('preload method not found')
          replacement='''    private void preloadCatalogAndShowHome() {
        updateStartupProgress(12, t("Preparando contenido…", "Preparing content…"));
        final java.util.concurrent.atomic.AtomicInteger done = new java.util.concurrent.atomic.AtomicInteger(0);
        CountDownLatch latch = new CountDownLatch(3);
        for (String kind : new String[]{"live","movie","series"}) {
            new Thread(() -> {
                try {
                    catalogCategories.put(kind, XtreamApi.categories(config, kind));
                    catalogItems.put(kind, XtreamApi.items(config, kind));
                } catch (Exception ignored) {
                } finally {
                    int n=done.incrementAndGet();
                    int pct=12 + n*29;
                    String label = n==1 ? t("TV en vivo preparada", "Live TV ready") : n==2 ? t("Películas preparadas", "Movies ready") : t("Series preparadas", "Series ready");
                    updateStartupProgress(Math.min(99,pct), label);
                    latch.countDown();
                }
            }, "preload-" + kind).start();
        }
        try { latch.await(); } catch (InterruptedException ignored) { Thread.currentThread().interrupt(); }
        catalogPreloaded = !catalogItems.isEmpty();
        updateStartupProgress(100, t("Contenido listo", "Content ready"));
        ui.postDelayed(this::showHome, 220);
    }

    private void updateStartupProgress(int percent,String label){
        ui.post(() -> {
            if(startupProgress!=null){startupProgress.setIndeterminate(false);startupProgress.setProgress(Math.max(0,Math.min(100,percent)));}
            if(startupProgressText!=null)startupProgressText.setText(label+"  "+percent+"%");
        });
    }

    private List<XtreamApi.Category> cachedCategories'''
          s=s[:old_method.start()]+replacement+s[old_method.end():]

          # Replace Google Cast route with safe system casting/mirroring, invoked only on click.
          m=re.search(r'    private MediaRouteButton createCastButton\(\)\{.*?\n    private void scheduleLiveHealthCheck',s,re.S)
          if not m: raise SystemExit('cast methods block not found')
          cast='''    private View createCastButton(){
        TextView b=focusButton("◉",21,this::openSystemCast);
        b.setContentDescription(t("Transmitir pantalla", "Cast screen"));
        return b;
    }

    private void openSystemCast(){
        try{
            Intent i=new Intent("android.settings.CAST_SETTINGS");
            startActivity(i);
        }catch(Throwable first){
            try{
                Intent i=new Intent("android.settings.WIFI_DISPLAY_SETTINGS");
                startActivity(i);
            }catch(Throwable second){
                Toast.makeText(this,t("La transmisión inalámbrica no está disponible en este dispositivo.","Wireless casting is not available on this device."),Toast.LENGTH_LONG).show();
            }
        }
    }

    private boolean castMedia(String url,XtreamApi.Item item,boolean live){ return false; }

    private void scheduleLiveHealthCheck'''
          s=s[:m.start()]+cast+s[m.end():]

          p.write_text(s)
          PY

          cat > ibo_independent/android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def panelApiUrl = providers.gradleProperty('PANEL_API_URL').getOrElse('https://ap24.top/ibo/index.php')
          android {
              namespace 'com.monopolio.mediaplayeribo'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.monopolio.mediaplayeribo'
                  minSdk 23
                  targetSdk 35
                  versionCode 7
                  versionName '5.1.0'
                  buildConfigField 'String', 'PANEL_API_URL', '"' + panelApiUrl + '"'
                  buildConfigField 'String', 'PANEL_APP_KEY', '"GELQV-YktQ03TB6_VsSWOyFDfJBJuTT65M25YUG8O58"'
              }
              buildFeatures { buildConfig true }
              buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
              implementation 'androidx.media3:media3-ui:1.5.1'
              implementation 'androidx.mediarouter:mediarouter:1.8.1'
          }
          EOF

          cat > ibo_independent/android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <queries><intent><action android:name="android.intent.action.VIEW" /><data android:mimeType="video/*" /></intent></queries>
              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:label="TV DIGITAL"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@drawable/tv_digital_banner"
                  android:theme="@style/AppTheme"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity android:name=".MainActivity" android:screenOrientation="landscape" android:configChanges="keyboard|keyboardHidden|orientation|screenSize" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p ibo_independent/android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p ibo_independent/android/app/src/main/res/mipmap
          mkdir -p ibo_independent/android/app/src/main/res/values

          cat > ibo_independent/android/app/src/main/res/values/launcher_colors.xml <<'EOF'
          <resources><color name="launcher_bg">#000000</color></resources>
          EOF
          cat > ibo_independent/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_bg"/>
              <foreground android:drawable="@drawable/tv_digital_icon"/>
          </adaptive-icon>
          EOF
          cp ibo_independent/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml ibo_independent/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > ibo_independent/android/app/src/main/res/mipmap/ic_launcher.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/launcher_bg"/>
              <item><bitmap android:src="@drawable/tv_digital_icon" android:gravity="center"/></item>
          </layer-list>
          EOF
          cp ibo_independent/android/app/src/main/res/mipmap/ic_launcher.xml ibo_independent/android/app/src/main/res/mipmap/ic_launcher_round.xml
          cat > ibo_independent/android/app/src/main/res/drawable/tv_digital_banner.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/launcher_bg"/>
              <item><bitmap android:src="@drawable/tv_digital_icon" android:gravity="center"/></item>
          </layer-list>
          EOF

      - name: Stability audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java').read_text()
          manifest=Path('ibo_independent/android/app/src/main/AndroidManifest.xml').read_text()
          gradle=Path('ibo_independent/android/app/build.gradle').read_text()
          checks={
            'horizontal startup progress':'progressBarStyleHorizontal' in m and 'startupProgressText' in m,
            'preload percentage':'updateStartupProgress(100' in m and 'AtomicInteger' in m,
            'TV DIGITAL logo on startup':'brandLogo()' in m,
            'no eager Google Cast context':'CastContext' not in m and 'play-services-cast-framework' not in gradle,
            'safe system casting':'android.settings.CAST_SETTINGS' in m,
            'adaptive launcher':'@mipmap/ic_launcher' in manifest and 'ic_launcher_round' in manifest,
            'Android TV banner':'tv_digital_banner' in manifest,
            'V5 selected-channel highlight':'liveRowBackground' in m,
            'offline channel screen':'CANAL TEMPORALMENTE FUERA DE SERVICIO' in m,
            'preloaded menus':'catalogCategories' in m and 'catalogItems' in m,
          }
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if not all(checks.values()): raise SystemExit(1)
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile and build
        working-directory: ibo_independent/android
        run: |
          gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          cp ibo_independent/android/app/build/outputs/apk/debug/app-debug.apk TV_DIGITAL_Premium_V5_1.apk
          unzip -t TV_DIGITAL_Premium_V5_1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TV_DIGITAL_Premium_V5_1.apk | head -25
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose TV_DIGITAL_Premium_V5_1.apk
          sha256sum TV_DIGITAL_Premium_V5_1.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TV_DIGITAL_Premium_V5_1_APK
          path: TV_DIGITAL_Premium_V5_1.apk
          if-no-files-found: error
