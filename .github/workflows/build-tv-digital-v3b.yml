name: Build TV DIGITAL V3 debugged B

on:
  push:
    branches:
      - ibo-ui-v3-brand-debug-20260921
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Restore Premium V2 source
        run: |
          mkdir -p /tmp/ibo_patch
          cat ibo_ui_v2/main2.b64.01 ibo_ui_v2/main2.b64.02 ibo_ui_v2/main2.b64.03 ibo_ui_v2/main2.b64.04 ibo_ui_v2/main2.b64.05 ibo_ui_v2/main2.b64.06a ibo_ui_v2/main2.b64.07 > /tmp/main.b64
          base64 -d /tmp/main.b64 > /tmp/MainActivity.java.gz
          gzip -t /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java
          cat ibo_ui_v2/other2.b64.01 ibo_ui_v2/other2.b64.02 ibo_ui_v2/other2.b64.03 > /tmp/other.b64
          base64 -d /tmp/other.b64 > /tmp/other.tgz
          tar -xzf /tmp/other.tgz -C /tmp/ibo_patch
          cp /tmp/ibo_patch/AppPrefs.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/AppPrefs.java
          cp /tmp/ibo_patch/ImageLoader.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/ImageLoader.java
          cp /tmp/ibo_patch/XtreamApi.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java

      - name: Apply button and TV DIGITAL patch
        run: |
          cat ibo_ui_v3/v3diff.0 ibo_ui_v3/v3diff.1 ibo_ui_v3/v3diff.2 ibo_ui_v3/v3diff.3 > /tmp/v3.patch
          MAIN=ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo
          (cd "$MAIN" && patch -p1 < /tmp/v3.patch)

          cat > ibo_independent/android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          def panelApiUrl = providers.gradleProperty('PANEL_API_URL').getOrElse('https://ap24.top/ibo/index.php')

          android {
              namespace 'com.monopolio.mediaplayeribo'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.monopolio.mediaplayeribo'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0.0'
                  buildConfigField 'String', 'PANEL_API_URL', '"' + panelApiUrl + '"'
                  buildConfigField 'String', 'PANEL_APP_KEY', '"GELQV-YktQ03TB6_VsSWOyFDfJBJuTT65M25YUG8O58"'
              }
              buildFeatures { buildConfig true }
              testOptions { unitTests.includeAndroidResources = true }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
              implementation 'androidx.media3:media3-ui:1.5.1'
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.robolectric:robolectric:4.13.2'
          }
          EOF

          cat > ibo_independent/android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:mimeType="video/*" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:label="TV DIGITAL"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          grep -q 'wireAction(b,s.action)' "$MAIN/MainActivity.java"
          grep -q 'wireAction(box,()->' "$MAIN/MainActivity.java"
          grep -q 'wireAction(row,()->playLive' "$MAIN/MainActivity.java"
          grep -q 'selectedCategory=x.id;refreshSectionItems' "$MAIN/MainActivity.java"
          grep -q 'KEYCODE_DPAD_CENTER' "$MAIN/MainActivity.java"
          grep -q 'KEYCODE_BUTTON_A' "$MAIN/MainActivity.java"
          grep -q 'https://ap24.top/ibo/tv_digital_logo.png' "$MAIN/MainActivity.java"
          test "$(grep -c 'new SettingItem' "$MAIN/MainActivity.java")" -ge 15

      - name: Create tests
        run: |
          TEST=ibo_independent/android/app/src/test/java/com/monopolio/mediaplayeribo
          mkdir -p "$TEST"
          cat > "$TEST/UiActionBindingTest.java" <<'EOF'
          package com.monopolio.mediaplayeribo;
          import static org.junit.Assert.*;
          import android.content.Context;
          import android.view.KeyEvent;
          import android.widget.TextView;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.robolectric.RobolectricTestRunner;
          import org.robolectric.RuntimeEnvironment;
          import java.util.concurrent.atomic.AtomicInteger;
          @RunWith(RobolectricTestRunner.class)
          public class UiActionBindingTest {
              @Test public void clickTriggersAction() {
                  Context c=RuntimeEnvironment.getApplication(); TextView v=new TextView(c);
                  AtomicInteger n=new AtomicInteger(); MainActivity.wireAction(v,n::incrementAndGet);
                  assertTrue(v.performClick()); assertEquals(1,n.get());
              }
              @Test public void remoteListenerHandlesTvKeys() {
                  Context c=RuntimeEnvironment.getApplication(); TextView v=new TextView(c);
                  AtomicInteger n=new AtomicInteger(); MainActivity.wireAction(v,n::incrementAndGet);
                  assertNotNull(v.getKeyDispatcherState());
                  v.requestFocus();
                  v.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_UP,KeyEvent.KEYCODE_DPAD_CENTER));
                  assertTrue(n.get() >= 0);
              }
          }
          EOF

          cat > "$TEST/AppPrefsTest.java" <<'EOF'
          package com.monopolio.mediaplayeribo;
          import static org.junit.Assert.*;
          import android.content.Context;
          import org.junit.Before;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.robolectric.RobolectricTestRunner;
          import org.robolectric.RuntimeEnvironment;
          import java.util.Arrays;
          import java.util.LinkedHashSet;
          @RunWith(RobolectricTestRunner.class)
          public class AppPrefsTest {
              private AppPrefs p;
              @Before public void setup(){Context c=RuntimeEnvironment.getApplication();c.getSharedPreferences("ibo_prefs_v2",Context.MODE_PRIVATE).edit().clear().commit();p=new AppPrefs(c);}
              @Test public void settingsPersist(){p.language("en");p.theme("gold");p.liveFormat("m3u8");p.liveOrder("name");p.mediaSort("rating");p.playerMode("auto");p.autoPreview(true);p.timeFormat("12");p.subtitles(false);p.subtitleSize("large");p.deviceType("tv");p.parentalEnabled(true);p.parentalPin("4321");p.hiddenCategories("live",new LinkedHashSet<>(Arrays.asList("10","20")));assertEquals("en",p.language());assertEquals("gold",p.theme());assertEquals("m3u8",p.liveFormat());assertEquals("name",p.liveOrder());assertEquals("rating",p.mediaSort());assertEquals("auto",p.playerMode());assertTrue(p.autoPreview());assertEquals("12",p.timeFormat());assertFalse(p.subtitles());assertEquals("large",p.subtitleSize());assertEquals("tv",p.deviceType());assertTrue(p.parentalEnabled());assertTrue(p.hiddenCategories("live").contains("10"));}
              @Test public void favoritesResumeHistory(){p.toggleFavorite("movie","55");assertTrue(p.isFavorite("movie","55"));p.addRecent("movie","1");p.saveResume("movie","1",15000L);assertEquals(15000L,p.resume("movie","1"));p.clearRecent("movie");assertEquals(0L,p.resume("movie","1"));}
          }
          EOF

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: ibo_independent/android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: ibo_independent/android
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build
        working-directory: ibo_independent/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify
        run: |
          cp ibo_independent/android/app/build/outputs/apk/debug/app-debug.apk TV_DIGITAL_Premium_V3.apk
          unzip -t TV_DIGITAL_Premium_V3.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TV_DIGITAL_Premium_V3.apk | head -12
          sha256sum TV_DIGITAL_Premium_V3.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TV_DIGITAL_Premium_V3_APK
          path: TV_DIGITAL_Premium_V3.apk
          if-no-files-found: error
