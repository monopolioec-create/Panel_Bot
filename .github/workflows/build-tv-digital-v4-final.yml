name: Build TV DIGITAL V4 Final APK

on:
  push:
    branches:
      - tv-digital-v4-final-20260922
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Restore V2 and V3 source
        run: |
          mkdir -p /tmp/ibo_patch
          cat ibo_ui_v2/main2.b64.01 ibo_ui_v2/main2.b64.02 ibo_ui_v2/main2.b64.03 ibo_ui_v2/main2.b64.04 ibo_ui_v2/main2.b64.05 ibo_ui_v2/main2.b64.06a ibo_ui_v2/main2.b64.07 > /tmp/main.b64
          base64 -d /tmp/main.b64 > /tmp/MainActivity.java.gz
          gzip -t /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java

          cat ibo_ui_v2/other2.b64.01 ibo_ui_v2/other2.b64.02 ibo_ui_v2/other2.b64.03 > /tmp/other.b64
          base64 -d /tmp/other.b64 > /tmp/other.tgz
          tar -xzf /tmp/other.tgz -C /tmp/ibo_patch
          cp /tmp/ibo_patch/AppPrefs.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/AppPrefs.java
          cp /tmp/ibo_patch/ImageLoader.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/ImageLoader.java
          cp /tmp/ibo_patch/XtreamApi.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java
          cp /tmp/ibo_patch/build.gradle ibo_independent/android/app/build.gradle
          cp /tmp/ibo_patch/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml

          cat ibo_ui_v3/v3diff.0 ibo_ui_v3/v3diff.1 ibo_ui_v3/v3diff.2 ibo_ui_v3/v3diff.3 > /tmp/v3.patch
          MAIN=ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo
          (cd "$MAIN" && patch -p1 < /tmp/v3.patch)

      - name: Apply V4 APK-only changes
        run: |
          cat ibo_v4/v4patch.00 ibo_v4/v4patch.01 ibo_v4/v4patch.02 > /tmp/v4.patch
          cd ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo
          patch -p1 < /tmp/v4.patch
          cd "$GITHUB_WORKSPACE"

          # Bring the exact TV DIGITAL brand into the APK launcher resources.
          mkdir -p ibo_independent/android/app/src/main/res/drawable
          curl -L --fail --retry 3 https://ap24.top/ibo/tv_digital_logo.png -o ibo_independent/android/app/src/main/res/drawable/tv_digital_icon.png

          python3 - <<'PY'
          from pathlib import Path
          p=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java')
          s=p.read_text()
          s=s.replace('Collections.sort(out,Comparator.comparing(x->x.name.toLowerCase(Locale.US)));',
                      'Collections.sort(out,(a,b)->a.name.toLowerCase(Locale.US).compareTo(b.name.toLowerCase(Locale.US)));')
          s=s.replace('.toUpperCase()', '.toUpperCase(Locale.ROOT)')
          p.write_text(s)

          p=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/DeviceIdentity.java')
          s=p.read_text()
          if 'import java.util.Locale;' not in s:
              s=s.replace('import java.util.Collections;', 'import java.util.Collections;\nimport java.util.Locale;')
          s=s.replace('.toLowerCase();', '.toLowerCase(Locale.ROOT);')
          p.write_text(s)
          PY

          cat > ibo_independent/android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def panelApiUrl = providers.gradleProperty('PANEL_API_URL').getOrElse('https://ap24.top/ibo/index.php')
          android {
              namespace 'com.monopolio.mediaplayeribo'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.monopolio.mediaplayeribo'
                  minSdk 23
                  targetSdk 35
                  versionCode 5
                  versionName '4.0.0'
                  buildConfigField 'String', 'PANEL_API_URL', '"' + panelApiUrl + '"'
                  buildConfigField 'String', 'PANEL_APP_KEY', '"GELQV-YktQ03TB6_VsSWOyFDfJBJuTT65M25YUG8O58"'
              }
              buildFeatures { buildConfig true }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
              implementation 'androidx.media3:media3-ui:1.5.1'
          }
          EOF
          sed -i 's/android:label="MediaPlayerIbo"/android:label="TV DIGITAL"/' ibo_independent/android/app/src/main/AndroidManifest.xml

      - name: Functional source audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java').read_text()
          api=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java').read_text()
          panel=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/PanelApi.java').read_text()
          manifest=Path('ibo_independent/android/app/src/main/AndroidManifest.xml').read_text()
          checks={
            'VLC/external package sets external mode':'prefs.playerMode("external")' in main and 'prefs.externalPackage(pkgs[sel[0]])' in main,
            'TS stream URL': '"ts"' in api and '"+ext' in api,
            'HLS stream URL': '"m3u8"' in api and 'liveFormat' in api,
            'parental disable requires current PIN':'verifyCurrentPin(() -> {prefs.parentalEnabled(false)' in main,
            'adult category lock':'runWithParentalForCategory' in main and 'isAdultName' in main and 'needsParental' in main,
            'premiere hero source':'heroCategoryMatch' in main and 'findPremiereCategory' in main and 'estreno' in main.lower(),
            'hero rotation 2.5 seconds':'2500' in main and 'rotateHero' in main,
            'selected category title':'selectedCategoryLabel()+" ("+out.size()+")"' in main,
            'selection feedback':'scaleX(1.015f)' in main and 'categoryList.invalidateViews()' in main,
            'future panel static hero':'hero_static_url' in panel and 'hero_mode' in panel,
            'future panel home order':'home_order' in panel and 'addConfiguredHomeCards' in main,
            'future panel home icons':'icon_live' in panel and 'icon_movie' in panel and 'icon_series' in panel,
            'launcher icon changed':'@drawable/tv_digital_icon' in manifest,
          }
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if not all(checks.values()): raise SystemExit(1)
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile Java
        working-directory: ibo_independent/android
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build APK
        working-directory: ibo_independent/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify final APK
        run: |
          cp ibo_independent/android/app/build/outputs/apk/debug/app-debug.apk TV_DIGITAL_Premium_V4.apk
          unzip -t TV_DIGITAL_Premium_V4.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TV_DIGITAL_Premium_V4.apk | head -15
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose TV_DIGITAL_Premium_V4.apk
          sha256sum TV_DIGITAL_Premium_V4.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TV_DIGITAL_Premium_V4_APK
          path: TV_DIGITAL_Premium_V4.apk
          if-no-files-found: error
