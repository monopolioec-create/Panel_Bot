name: Build MediaPlayerIbo Premium UI v2b

on:
  push:
    branches:
      - ibo-ui-v2-20260921
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild premium UI sources
        run: |
          mkdir -p /tmp/ibo_patch
          cat ibo_ui_v2/main.b64.01 ibo_ui_v2/main.b64.02 ibo_ui_v2/main.b64.03 ibo_ui_v2/main.b64.04 ibo_ui_v2/main.b64.05 > /tmp/main.b64
          base64 -d /tmp/main.b64 > /tmp/MainActivity.java.gz
          gzip -t /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java

          base64 -d ibo_ui_v2/other.b64 > /tmp/ibo_other.tgz
          tar -tzf /tmp/ibo_other.tgz
          tar -xzf /tmp/ibo_other.tgz -C /tmp/ibo_patch

          cp /tmp/ibo_patch/AppPrefs.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/AppPrefs.java
          cp /tmp/ibo_patch/ImageLoader.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/ImageLoader.java
          cp /tmp/ibo_patch/XtreamApi.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java
          cp /tmp/ibo_patch/build.gradle ibo_independent/android/app/build.gradle
          cp /tmp/ibo_patch/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml

          wc -l ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java
          grep -n "versionName" ibo_independent/android/app/build.gradle

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.4

      - name: Install Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ibo_independent/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          cp ibo_independent/android/app/build/outputs/apk/debug/app-debug.apk MediaPlayerIbo_Premium_v2.apk
          file MediaPlayerIbo_Premium_v2.apk
          sha256sum MediaPlayerIbo_Premium_v2.apk

      - uses: actions/upload-artifact@v7
        with:
          name: MediaPlayerIbo_Premium_v2b
          path: MediaPlayerIbo_Premium_v2.apk
          if-no-files-found: error
