name: Export Decoded PC Local Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-pc-local.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode source
        shell: bash
        run: |
          python - <<'PY'
          import base64, glob, pathlib, zipfile
          parts=[]
          for p in sorted(glob.glob('pc_local/source.part*')):
              s=pathlib.Path(p).read_text().strip()
              if pathlib.Path(p).name!='source.part04':
                  s=s[:6000]
              parts.append(s)
          pathlib.Path('/tmp/source.zip').write_bytes(base64.b64decode(''.join(parts)))
          pathlib.Path('decoded').mkdir(exist_ok=True)
          with zipfile.ZipFile('/tmp/source.zip') as z:
              z.extractall('decoded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-pc-local-source
          path: decoded/
          retention-days: 1
