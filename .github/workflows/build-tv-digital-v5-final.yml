name: Build TV DIGITAL V5 Final

on:
  push:
    branches:
      - tv-digital-v5-final-20260922
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Reconstruct V4 base
        run: |
          mkdir -p /tmp/ibo_patch
          cat ibo_ui_v2/main2.b64.01 ibo_ui_v2/main2.b64.02 ibo_ui_v2/main2.b64.03 ibo_ui_v2/main2.b64.04 ibo_ui_v2/main2.b64.05 ibo_ui_v2/main2.b64.06a ibo_ui_v2/main2.b64.07 > /tmp/main.b64
          base64 -d /tmp/main.b64 > /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java
          cat ibo_ui_v2/other2.b64.01 ibo_ui_v2/other2.b64.02 ibo_ui_v2/other2.b64.03 > /tmp/other.b64
          base64 -d /tmp/other.b64 > /tmp/other.tgz
          tar -xzf /tmp/other.tgz -C /tmp/ibo_patch
          cp /tmp/ibo_patch/AppPrefs.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/AppPrefs.java
          cp /tmp/ibo_patch/ImageLoader.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/ImageLoader.java
          cp /tmp/ibo_patch/XtreamApi.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java
          cp /tmp/ibo_patch/build.gradle ibo_independent/android/app/build.gradle
          cp /tmp/ibo_patch/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml
          cat ibo_ui_v3/v3diff.0 ibo_ui_v3/v3diff.1 ibo_ui_v3/v3diff.2 ibo_ui_v3/v3diff.3 > /tmp/v3.patch
          (cd ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo && patch -p1 < /tmp/v3.patch)
          cat ibo_v4/v4line.00 ibo_v4/v4line.01 ibo_v4/v4line.02 ibo_v4/v4line.03 > /tmp/v4.patch
          (cd ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo && patch --batch -p1 < /tmp/v4.patch || true)
          cp ibo_v4/tv_digital_icon.png ibo_independent/android/app/src/main/res/drawable/tv_digital_icon.png

      - name: Apply V5 final code
        run: |
          MAIN=ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo
          cat ibo_v5_src/MainActivity.part00 ibo_v5_src/MainActivity.part01 ibo_v5_src/MainActivity.part02 ibo_v5_src/MainActivity.part03 ibo_v5_src/MainActivity.part04 ibo_v5_src/MainActivity.part05 ibo_v5_src/MainActivity.part06 ibo_v5_src/MainActivity.part07 ibo_v5_src/MainActivity.part08 ibo_v5_src/MainActivity.part09 ibo_v5_src/MainActivity.part10 ibo_v5_src/MainActivity.part11 > "$MAIN/MainActivity.java"
          cp ibo_v5_src/CastOptionsProvider.java "$MAIN/CastOptionsProvider.java"
          cp ibo_v5_src/build.gradle ibo_independent/android/app/build.gradle
          cp ibo_v5_src/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml
          test -f ibo_independent/android/app/src/main/res/drawable/tv_digital_icon.png
          echo "V5 MainActivity bytes: $(wc -c < "$MAIN/MainActivity.java")"
          test "$(wc -c < "$MAIN/MainActivity.java")" -eq 74686

      - name: Fix startup crash, launcher branding and loading bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java')
          s=p.read_text()

          # Horizontal startup loading bar instead of circular spinner.
          old='''            ProgressBar p = new ProgressBar(this);
            box.addView(p, new LinearLayout.LayoutParams(dp(42), dp(42)));'''
          new='''            ProgressBar p = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
            p.setIndeterminate(true);
            LinearLayout.LayoutParams progressLp = new LinearLayout.LayoutParams(dp(440), dp(10));
            progressLp.topMargin = dp(10);
            box.addView(p, progressLp);'''
          if old not in s:
              raise SystemExit('startup ProgressBar block not found')
          s=s.replace(old,new,1)

          # Cast must never be able to crash startup on TV boxes without compatible Google Play services.
          s=s.replace('MediaRouteButton castButton = createCastButton();','View castButton = createCastButton();')

          old_method='''    private MediaRouteButton createCastButton(){
        MediaRouteButton b=new MediaRouteButton(this);
        b.setContentDescription(t("Transmitir a Chromecast","Cast to Chromecast"));
        try{CastButtonFactory.setUpMediaRouteButton(getApplicationContext(),b);}catch(Throwable ignored){}
        b.setFocusable(true);
        return b;
    }'''
          new_method='''    private View createCastButton(){
        try{
            int status=com.google.android.gms.common.GoogleApiAvailability.getInstance().isGooglePlayServicesAvailable(this);
            if(status!=com.google.android.gms.common.ConnectionResult.SUCCESS){
                TextView fallback=focusButton("◉",20,()->Toast.makeText(this,t("Chromecast no está disponible en este dispositivo","Chromecast is not available on this device"),Toast.LENGTH_SHORT).show());
                fallback.setContentDescription(t("Chromecast no disponible","Chromecast unavailable"));
                return fallback;
            }
            MediaRouteButton b=new MediaRouteButton(this);
            b.setContentDescription(t("Transmitir a Chromecast","Cast to Chromecast"));
            CastButtonFactory.setUpMediaRouteButton(getApplicationContext(),b);
            b.setFocusable(true);
            return b;
        }catch(Throwable error){
            TextView fallback=focusButton("◉",20,()->Toast.makeText(this,t("Chromecast no está disponible en este dispositivo","Chromecast is not available on this device"),Toast.LENGTH_SHORT).show());
            fallback.setContentDescription(t("Chromecast no disponible","Chromecast unavailable"));
            return fallback;
        }
    }'''
          if old_method not in s:
              raise SystemExit('createCastButton method not found')
          s=s.replace(old_method,new_method,1)

          # If any vendor-specific launcher/cast issue occurs while building the home UI, keep the app alive.
          old='''        catalogPreloaded = !catalogItems.isEmpty();
        ui.post(this::showHome);'''
          new='''        catalogPreloaded = !catalogItems.isEmpty();
        ui.post(() -> {
            try { showHome(); }
            catch (Throwable fatalUi) {
                root.removeAllViews();
                LinearLayout safe = new LinearLayout(this);
                safe.setOrientation(LinearLayout.VERTICAL);
                safe.setGravity(Gravity.CENTER);
                safe.setPadding(dp(40),dp(30),dp(40),dp(30));
                ImageView logo = brandLogo();
                safe.addView(logo,new LinearLayout.LayoutParams(dp(320),dp(190)));
                TextView msg = tv(t("TV DIGITAL está listo. Reinicia la aplicación si el dispositivo acaba de actualizar sus servicios.","TV DIGITAL is ready. Restart the app if the device has just updated its services."),17,TEXT,false);
                msg.setGravity(Gravity.CENTER);
                safe.addView(msg,new LinearLayout.LayoutParams(-1,dp(90)));
                root.addView(safe,new FrameLayout.LayoutParams(-1,-1));
            }
        });'''
          if old not in s:
              raise SystemExit('preload showHome block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          RES=ibo_independent/android/app/src/main/res
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi" "$RES/drawable" "$RES/values"

          cat > "$RES/values/launcher_colors.xml" <<'EOF'
          <resources>
              <color name="launcher_black">#000000</color>
          </resources>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_black" />
              <foreground android:drawable="@drawable/tv_digital_icon" />
          </adaptive-icon>
          EOF

          cat > "$RES/mipmap-anydpi/ic_launcher.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/launcher_black" />
              <item android:gravity="center" android:drawable="@drawable/tv_digital_icon" />
          </layer-list>
          EOF

          cat > "$RES/drawable/tv_digital_banner.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/launcher_black" />
              <item android:gravity="center" android:drawable="@drawable/tv_digital_icon" />
          </layer-list>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('ibo_independent/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:icon="@drawable/tv_digital_icon"','android:icon="@mipmap/ic_launcher"')
          s=s.replace('android:roundIcon="@drawable/tv_digital_icon"','android:roundIcon="@mipmap/ic_launcher"')
          if 'android:banner=' not in s:
              s=s.replace('android:roundIcon="@mipmap/ic_launcher"', 'android:roundIcon="@mipmap/ic_launcher"\n        android:banner="@drawable/tv_digital_banner"')
          p.write_text(s)

          p=Path('ibo_independent/android/app/build.gradle')
          s=p.read_text().replace("versionCode 6","versionCode 7").replace("versionName '5.0.0'","versionName '5.0.1'")
          p.write_text(s)
          PY

      - name: Functional audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java').read_text()
          manifest=Path('ibo_independent/android/app/src/main/AndroidManifest.xml').read_text()
          gradle=Path('ibo_independent/android/app/build.gradle').read_text()
          provider=Path('ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/CastOptionsProvider.java').read_text()
          checks={
            'persistent selected live-channel highlight':'liveRowBackground' in m and 'liveList.invalidateViews()' in m,
            'native player restore option':'Predeterminado de TV DIGITAL (interno)' in m and 'prefs.playerMode("internal")' in m,
            'Cast route button':'createCastButton' in m and 'CastButtonFactory.setUpMediaRouteButton' in m,
            'Cast media load':'MediaLoadRequestData' in m and 'castMedia(' in m,
            'Cast provider metadata':'OPTIONS_PROVIDER_CLASS_NAME' in manifest and 'CastOptionsProvider' in provider,
            'offline channel screen':'CANAL TEMPORALMENTE FUERA DE SERVICIO' in m and 'showChannelOffline' in m,
            'stall health check':'scheduleLiveHealthCheck' in m and '15000' in m,
            'startup preload':'preloadCatalogAndShowHome' in m and 'CountDownLatch' in m,
            'no normal section spinner':'showLoading(t("Cargando contenido' not in m[m.find('private void loadSection'):m.find('private void showSectionUI')],
            'catalog cache':'catalogCategories' in m and 'catalogItems' in m,
            'launcher icon':'android:icon="@mipmap/ic_launcher"' in manifest and 'android:roundIcon="@mipmap/ic_launcher"' in manifest,
            'android tv banner':'android:banner="@drawable/tv_digital_banner"' in manifest,
            'horizontal startup progress':'progressBarStyleHorizontal' in m,
            'cast startup hardening':'GoogleApiAvailability' in m and 'private View createCastButton()' in m,
            'cast dependency':'play-services-cast-framework' in gradle,
          }
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if not all(checks.values()): raise SystemExit(1)
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile
        working-directory: ibo_independent/android
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build APK
        working-directory: ibo_independent/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          cp ibo_independent/android/app/build/outputs/apk/debug/app-debug.apk TV_DIGITAL_Premium_V5.apk
          unzip -t TV_DIGITAL_Premium_V5.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TV_DIGITAL_Premium_V5.apk | head -20
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose TV_DIGITAL_Premium_V5.apk
          sha256sum TV_DIGITAL_Premium_V5.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TV_DIGITAL_Premium_V5_APK
          path: TV_DIGITAL_Premium_V5.apk
          if-no-files-found: error
