      - name: Compile Desktop EXE
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          pyinstaller --clean --onefile --noconsole --name MonopolioMultiBotDesktop --icon app.ico --paths "." --hidden-import bootstrap_imports --add-binary "wuzapi.exe;." --add-data "app.ico;." --add-data "core_local.py;." --add-data "gui_local.py;." main_local.py
          Get-Item dist\MonopolioMultiBotDesktop.exe

      - name: Verify packaged modules
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          pyi-archive_viewer -l ".\dist\MonopolioMultiBotDesktop.exe" | Out-File ".\archive_contents.txt" -Encoding utf8
          $listing = Get-Content ".\archive_contents.txt" -Raw
          foreach ($required in @("core_local.py","gui_local.py","wuzapi.exe")) {
            if ($listing -notmatch [regex]::Escape($required)) {
              throw "$required no quedó dentro del ejecutable"
            }
          }
          Write-Host "Verificación física OK."

      - name: Runtime self-test
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          $p = Start-Process -FilePath ".\dist\MonopolioMultiBotDesktop.exe" -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(20000)) {
            try { Stop-Process -Id $p.Id -Force } catch {}
            throw "El self-test del ejecutable superó 20 segundos."
          }
          if ($p.ExitCode -ne 0) {
            $report = Join-Path $env:TEMP "multibot-selftest.txt"
            if (Test-Path $report) {
              Write-Host "----- SELF TEST TRACEBACK -----"
              Get-Content $report
              Write-Host "----- END TRACEBACK -----"
            }
            throw "El self-test del ejecutable falló. ExitCode=$($p.ExitCode)"
          }
          Write-Host "Runtime self-test OK."

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build professional installer
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Get-Item output\MonopolioMultiBotDesktop_Setup_v2.0.7.exe
          Get-FileHash output\MonopolioMultiBotDesktop_Setup_v2.0.7.exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MonopolioMultiBotDesktop-Windows-v2.0.7
          path: pc_local/buildsrc/output/MonopolioMultiBotDesktop_Setup_v2.0.7.exe
          retention-days: 30
