                      self.google_contacts_status.set('Sin negocio seleccionado')
                      return
                  st=C.google_status(pid)
                  self.google_contacts_status.set('CONECTADO A GOOGLE' if st.get('connected') else 'Solo guardado local')

              def connect_google_contacts(self):
                  pid=self.pid()
                  if not pid:return
                  path=filedialog.askopenfilename(
                      parent=self,
                      title='Selecciona credentials.json de Google',
                      filetypes=[('JSON de Google','*.json'),('Todos los archivos','*.*')]
                  )
                  if not path:return
                  try:
                      C.google_connect(pid,path)
                      self.refresh_google_contacts_status()
                      messagebox.showinfo('Google Contacts','Google Contacts quedó conectado para este negocio.',parent=self)
                  except Exception as e:
                      messagebox.showerror('Google Contacts',str(e),parent=self)

              def disconnect_google_contacts(self):
                  pid=self.pid()
                  if not pid:return
                  C.google_disconnect(pid);self.refresh_google_contacts_status()
                  messagebox.showinfo('Google Contacts','Se desconectó Google. Los contactos seguirán guardándose localmente.',parent=self)

              def sync_all_google_contacts(self):
                  pid=self.pid()
                  if not pid:return
                  if not C.google_status(pid).get('connected'):
                      return messagebox.showinfo('Google Contacts','Primero conecta tu cuenta de Google.',parent=self)
                  def worker():
                      ok,total=C.google_sync_all(pid)
                      self.after(0,lambda:messagebox.showinfo('Google Contacts',f'Sincronización terminada: {ok} de {total} contactos.',parent=self))
                      self.after(0,self.refresh_contacts)
                  threading.Thread(target=worker,daemon=True,name='google-sync-all').start()

              def open_google_setup_help(self):
                  webbrowser.open('https://developers.google.com/people/quickstart/python')
          '''
          google_ui=textwrap.indent(textwrap.dedent(google_ui).strip()+"\n","    ")

          build_anchor = "    def build_contacts(self):\n"
          if google_ui.strip() not in g:
              pos=g.find(build_anchor)
              if pos<0:
                  raise SystemExit("No se encontró build_contacts para Google")
              g=g[:pos]+google_ui+g[pos:]

          top_anchor = "        top=ttk.Frame(f);top.pack(fill='x')"
          google_box = "        google=ttk.LabelFrame(f,text='Google Contacts (opcional)',padding=10);google.pack(fill='x',pady=(0,10))\n        self.google_contacts_status=tk.StringVar(value='Solo guardado local')\n        ttk.Label(google,textvariable=self.google_contacts_status,font=('Segoe UI',10,'bold')).pack(side='left',padx=(0,12))\n        ttk.Button(google,text='Conectar Google',command=self.connect_google_contacts).pack(side='left')\n        ttk.Button(google,text='Sincronizar todos',command=self.sync_all_google_contacts).pack(side='left',padx=5)\n        ttk.Button(google,text='Desconectar',command=self.disconnect_google_contacts).pack(side='left')\n        ttk.Button(google,text='Guía de configuración',command=self.open_google_setup_help).pack(side='right')\n        self.refresh_google_contacts_status()\n"
          if top_anchor not in g:
              raise SystemExit("No se encontró ancla de Contactos para Google")
          g=g.replace(top_anchor,google_box+top_anchor,1)

          old_pc = "    def profile_changed(self):self.refresh_home();self.refresh_rules();self.refresh_contacts();self.refresh_status();self.refresh_logs();self.refresh_whatsapp()"
          new_pc = "    def profile_changed(self):self.refresh_home();self.refresh_rules();self.refresh_contacts();self.refresh_google_contacts_status();self.refresh_status();self.refresh_logs();self.refresh_whatsapp()"
          g=g.replace(old_pc,new_pc,1)

          compile(g,str(gui_path),'exec')
          gui_path.write_text(g,encoding='utf-8')

          # ---------- Installer ----------
          t=iss_path.read_text(encoding='utf-8')
          t=t.replace('2.0.6','2.0.7')
          iss_path.write_text(t,encoding='utf-8')
          '@ | Set-Content patch_google_v207.py -Encoding UTF8
          python patch_google_v207.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build WuzAPI Windows
        shell: powershell
        run: |
          git clone https://github.com/asternic/wuzapi.git $env:TEMP\wuzapi-local
          Set-Location $env:TEMP\wuzapi-local
          git checkout $env:WUZAPI_COMMIT
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -trimpath -ldflags="-s -w" -o "$env:GITHUB_WORKSPACE\pc_local\buildsrc\wuzapi.exe" .
          Get-Item "$env:GITHUB_WORKSPACE\pc_local\buildsrc\wuzapi.exe"

      - name: Install Python build dependencies
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Internal media payload tests
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          @'
          import base64, importlib.util, pathlib, tempfile, time
          from PIL import Image

          spec=importlib.util.spec_from_file_location("core_local_test","core_local.py")
          C=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(C)

          td=pathlib.Path(tempfile.mkdtemp(prefix="multibot-media-test-"))

          # Archivos de prueba representativos.
          png=td/"test.png"
          Image.new("RGB",(4,4),(20,140,80)).save(png,"PNG")
          mp4=td/"test.mp4"
          mp4.write_bytes(b"\x00\x00\x00\x18ftypmp42\x00\x00\x00\x00mp42isom" + b"0"*128)
          pdf=td/"test.pdf"
          pdf.write_bytes(b"%PDF-1.4\n1 0 obj<</Type/Catalog>>endobj\n%%EOF\n")
          mp3=td/"test.mp3"
          mp3.write_bytes(b"ID3\x04\x00\x00\x00\x00\x00\x00" + b"0"*128)
          wav=td/"test.wav"
          wav.write_bytes(b"RIFF" + (36).to_bytes(4,"little") + b"WAVEfmt " + b"0"*32)

          ids={}
          for kind,p in [("image",png),("video",mp4),("pdf",pdf),("audio",mp3),("wav",wav)]:
              ids[kind]=C.add_media(str(p))

          expected={
              "image":("image","data:image/png;base64,",png.read_bytes()),
              "video":("video","data:video/mp4;base64,",mp4.read_bytes()),
              "pdf":("", "data:application/pdf;base64,",pdf.read_bytes()),
              "audio":("audio","data:audio/mpeg;base64,",mp3.read_bytes()),
              "wav":("audio","data:audio/wav;base64,",wav.read_bytes()),
          }
          for key,(kind,prefix,raw) in expected.items():
              uri=C.media_data_uri(ids[key],kind)
              assert uri.startswith(prefix),(key,uri[:80])
              decoded=base64.b64decode(uri.split(",",1)[1])
              assert decoded==raw,key

          captured=[]
          def fake_call(token,method,path,body=None,timeout=60):
              captured.append((path,body,timeout))
              return 200,{"success":True,"data":{"Details":"Sent"}}
          C.WUZ.call=fake_call
          eng=C.Engine()
          common=dict(pid="test",token="tok",route="573000000000@s.whatsapp.net",phone="573000000000",name="Test",msg="hola",rule_name="Prueba",started=time.perf_counter())

          actions=[
              {"type":"image","media_id":ids["image"],"text":"foto"},
              {"type":"video","media_id":ids["video"],"text":"video"},
              {"type":"document","media_id":ids["pdf"],"text":"pdf"},
              {"type":"audio","media_id":ids["audio"]},
          ]
          for a in actions:
              eng.execute_action(a=a,**common)

          assert captured[0][0]=="/chat/send/image"
          assert captured[0][1]["Image"].startswith("data:image/png;base64,")
          assert captured[0][1]["MimeType"]=="image/png"

          assert captured[1][0]=="/chat/send/video"
          assert captured[1][1]["Video"].startswith("data:video/mp4;base64,")
          assert captured[1][1]["MimeType"]=="video/mp4"
          assert captured[1][2]>=300

          assert captured[2][0]=="/chat/send/document"
          assert captured[2][1]["Document"].startswith("data:application/pdf;base64,")
          assert captured[2][1]["MimeType"]=="application/pdf"
          assert captured[2][1]["FileName"]=="test.pdf"

          assert captured[3][0]=="/chat/send/audio"
          assert captured[3][1]["Audio"].startswith("data:audio/mpeg;base64,")
          assert captured[3][1]["mimetype"]=="audio/mpeg"
          assert captured[3][1]["PTT"] is False

          # Una URL pública sigue enviándose como URL y no se convierte a data URI.
          captured.clear()
          eng.execute_action(
              a={"type":"image","url":"https://example.com/test.jpg","text":"url"},
              **common
          )
          assert captured[0][1]["Image"]=="https://example.com/test.jpg"

          print("MEDIA TESTS OK: image, video, PDF/document, MP3/WAV audio, public URL")
          '@ | Set-Content test_media_v205.py -Encoding UTF8
          python test_media_v205.py

      - name: Internal contact autosave tests
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          @'
          import time
          import core_local as C

          pid=C.add_profile("TEST CONTACTOS V206")
          eng=C.Engine()
          calls=[]
          C.WUZ.call=lambda *a,**k: calls.append((a,k)) or (200,{"success":True})

          eng.execute_action(
              pid=pid,token="dummy",route="573001112233@s.whatsapp.net",
              phone="573001112233",name="Ana Cliente",msg="Hola",
              a={"type":"save_contact","contact_name":"@nombre","label":"Interesado","note":"Llegó: @mensaje"},
              rule_name="Captura lead",started=time.perf_counter()
          )
          rows=C.contacts_for(pid)
