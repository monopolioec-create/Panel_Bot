name: Build Monopolio MultiBot Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc_local/source.part*'
      - '.github/workflows/build-pc-local.yml'

permissions:
  contents: read

env:
  WUZAPI_COMMIT: 5f0350f3af2abf6900739cc8e23b55700510451d

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Decode and patch source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force pc_local\buildsrc | Out-Null
          $parts = Get-ChildItem "pc_local\source.part*" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Se esperaban 5 partes de fuente y se encontraron $($parts.Count)" }
          $b64 = ""
          foreach ($part in $parts) {
            $piece = (Get-Content $part.FullName -Raw).Trim()
            if ($part.Name -ne "source.part04") {
              if ($piece.Length -lt 6000) { throw "Parte incompleta: $($part.Name)" }
              $piece = $piece.Substring(0,6000)
            }
            $b64 += $piece
          }
          [IO.File]::WriteAllBytes("pc_local\source.zip",[Convert]::FromBase64String($b64))
          Expand-Archive -Force pc_local\source.zip pc_local\buildsrc
          @'
          import pathlib, re

          core_path = pathlib.Path(r"pc_local\buildsrc\core_local.py")
          s = core_path.read_text(encoding="utf-8")
          s = s.replace("APP_VERSION = '2.0.0'", "APP_VERSION = '2.0.1'")
          new_block = """    def _kill_stale_port(self):
              if os.name != 'nt': return
              try:
                  flags=getattr(subprocess,'CREATE_NO_WINDOW',0)
                  r=subprocess.run(['netstat','-ano','-p','tcp'],capture_output=True,text=True,errors='ignore',creationflags=flags,timeout=8)
                  pids=set()
                  for line in (r.stdout or '').splitlines():
                      cols=line.split()
                      if len(cols) >= 4 and cols[0].upper() == 'TCP':
                          local=cols[1]
                          pid=cols[-1]
                          if pid.isdigit() and local.endswith(':'+str(WUZ_PORT)) and (local.startswith('127.0.0.1:') or local.startswith('0.0.0.0:') or local.startswith('[::]:')):
                              pids.add(pid)
                  for pid in pids:
                      subprocess.run(['taskkill','/F','/PID',pid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,creationflags=flags,timeout=8)
                  if pids: time.sleep(1.0)
              except Exception:
                  pass

              def start(self):
                  with self.lock:
                      if self.process and self.process.poll() is None: return
                      if not os.path.exists(self.exe): raise RuntimeError('No se encontró el motor interno WuzAPI.')
                      self._kill_stale_port()
                      env = os.environ.copy(); env['WUZAPI_ADMIN_TOKEN'] = CFG['admin_token']; env['WEBHOOK_FORMAT']='json'; env['TZ']='America/Bogota'
                      args=[self.exe,'-skipmedia','-logtype','json','-address','127.0.0.1','-port',str(WUZ_PORT),'-osname',APP_NAME,'-datadir',str(WUZ_DIR),'-admintoken',CFG['admin_token']]
                      flags=getattr(subprocess,'CREATE_NO_WINDOW',0)
                      self.process=subprocess.Popen(args,cwd=str(WUZ_DIR),env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,creationflags=flags)
                  self.wait_ready(30)
                  code,_=self.admin('GET','/admin/users')
                  if code == 401:
                      raise RuntimeError('El motor local rechazó la clave administrativa. Reinicia la aplicación para recuperar la sesión.')
          """
          new_block = re.sub(r'^              ', '', new_block, flags=re.M)
          s2, n = re.subn(r"    def start\(self\):\n.*?(?=\n    def stop\(self\):)", new_block.rstrip(), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("No se pudo parchear WuzAPI.start")
          core_path.write_text(s2, encoding="utf-8")

          iss_path = pathlib.Path(r"pc_local\buildsrc\installer.iss")
          t = iss_path.read_text(encoding="utf-8")
          t = t.replace('#define MyAppVersion "2.0.0"', '#define MyAppVersion "2.0.1"')
          t = t.replace('OutputBaseFilename=MonopolioMultiBotDesktop_Setup_v2.0.0', 'OutputBaseFilename=MonopolioMultiBotDesktop_Setup_v2.0.1')
          t = t.replace('VersionInfoVersion=2.0.0.0', 'VersionInfoVersion=2.0.1.0')
          line = 'Filename: "{cmd}"; Parameters: "/C taskkill /F /IM MonopolioMultiBotHub.exe >nul 2>&1"; Flags: runhidden waituntilterminated'
          if 'taskkill /F /IM wuzapi.exe' not in t:
              t = t.replace(line, line + '\nFilename: "{cmd}"; Parameters: "/C taskkill /F /IM wuzapi.exe >nul 2>&1"; Flags: runhidden waituntilterminated')
              uline = 'Filename: "{cmd}"; Parameters: "/C taskkill /F /IM {#MyAppExeName} >nul 2>&1"; Flags: runhidden waituntilterminated; RunOnceId: "StopMultiBotDesktop"'
              t = t.replace(uline, uline + '\nFilename: "{cmd}"; Parameters: "/C taskkill /F /IM wuzapi.exe >nul 2>&1"; Flags: runhidden waituntilterminated; RunOnceId: "StopWuzAPI"')
              needle = "  Exec(ExpandConstant('{cmd}'), '/C taskkill /F /IM MonopolioMultiBotHub.exe >nul 2>&1', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);"
              t = t.replace(needle, needle + "\n  Exec(ExpandConstant('{cmd}'), '/C taskkill /F /IM wuzapi.exe >nul 2>&1', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);")
          iss_path.write_text(t, encoding="utf-8")
          '@ | Set-Content patch_v201.py -Encoding UTF8
          python patch_v201.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build WuzAPI Windows
        shell: powershell
        run: |
          git clone https://github.com/asternic/wuzapi.git $env:TEMP\wuzapi-local
          Set-Location $env:TEMP\wuzapi-local
          git checkout $env:WUZAPI_COMMIT
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -trimpath -ldflags="-s -w" -o "$env:GITHUB_WORKSPACE\pc_local\buildsrc\wuzapi.exe" .
          Get-Item "$env:GITHUB_WORKSPACE\pc_local\buildsrc\wuzapi.exe"

      - name: Install Python build dependencies
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate application icon
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          @'
          from PIL import Image, ImageDraw, ImageFont
          im=Image.new("RGBA",(256,256),(16,24,39,255))
          d=ImageDraw.Draw(im)
          d.ellipse((18,18,238,238),outline=(184,137,34,255),width=14)
          d.rounded_rectangle((50,62,206,202),radius=30,fill=(10,143,78,255),outline=(184,137,34,255),width=7)
          try:
              font=ImageFont.truetype("arialbd.ttf",76)
          except:
              font=ImageFont.load_default()
          d.text((71,89),"MB",font=font,fill=(255,232,166,255))
          im.save("app.ico",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content make_icon.py -Encoding UTF8
          python make_icon.py

      - name: Compile Desktop EXE
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          pyinstaller --clean --onefile --noconsole --name MonopolioMultiBotDesktop --icon app.ico --add-binary "wuzapi.exe;." --add-data "app.ico;." main_local.py
          Get-Item dist\MonopolioMultiBotDesktop.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build professional installer
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Get-Item output\MonopolioMultiBotDesktop_Setup_v2.0.1.exe
          Get-FileHash output\MonopolioMultiBotDesktop_Setup_v2.0.1.exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MonopolioMultiBotDesktop-Windows-v2.0.1
          path: pc_local/buildsrc/output/MonopolioMultiBotDesktop_Setup_v2.0.1.exe
          retention-days: 30
