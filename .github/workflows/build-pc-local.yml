      - name: Internal Google Contacts tests
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_local\buildsrc"
          @'
          import time
          import core_local as C

          pid=C.add_profile("TEST GOOGLE V207")
          cid,_=C.save_customer_contact(pid,"573009998877","Cliente Google","Lead","Prueba Google","Hola","Regla Google")

          class FakeCreate:
              def __init__(self,parent,body):
                  self.parent=parent;self.body=body
              def execute(self):
                  self.parent.created.append(self.body)
                  return {"resourceName":"people/c123"}
          class FakeSearch:
              def __init__(self,result):
                  self.result=result
              def execute(self):return self.result
          class FakePeople:
              def __init__(self):
                  self.created=[];self.search_calls=[]
              def searchContacts(self,query,readMask,pageSize):
                  self.search_calls.append(query)
                  return FakeSearch({"results":[]})
              def createContact(self,body,personFields):
                  return FakeCreate(self,body)
          class FakeService:
              def __init__(self):self.p=FakePeople()
              def people(self):return self.p

          fake=FakeService()
          C.google_status=lambda _pid: {"connected":True,"configured":True}
          C.google_service=lambda _pid: fake

          assert C.google_sync_contact(cid) is True
          row=C.get_contact(cid)
          assert row["google_resource"]=="people/c123"
          assert row["google_synced_at"]
          assert fake.p.created and fake.p.created[0]["phoneNumbers"][0]["value"]=="+573009998877"

          # Segunda sincronización no debe crear un duplicado si ya tiene resourceName.
          before=len(fake.p.created)
          assert C.google_sync_contact(cid) is True
          assert len(fake.p.created)==before

          print("GOOGLE CONTACTS TESTS OK: local fallback metadata + create + no duplicate")
          '@ | Set-Content test_google_v207.py -Encoding UTF8
          python test_google_v207.py

