name: Build Monopolio MultiBot Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc_local/source.part*'
      - '.github/workflows/build-pc-local.yml'

permissions:
  contents: read

env:
  WUZAPI_COMMIT: 5f0350f3af2abf6900739cc8e23b55700510451d

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Decode and patch source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force pc_local\buildsrc | Out-Null
          $parts = Get-ChildItem "pc_local\source.part*" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Se esperaban 5 partes de fuente y se encontraron $($parts.Count)" }
          $b64 = ""
          foreach ($part in $parts) {
            $piece = (Get-Content $part.FullName -Raw).Trim()
            if ($part.Name -ne "source.part04") {
              if ($piece.Length -lt 6000) { throw "Parte incompleta: $($part.Name)" }
              $piece = $piece.Substring(0,6000)
            }
            $b64 += $piece
          }
          [IO.File]::WriteAllBytes("pc_local\source.zip",[Convert]::FromBase64String($b64))
          Expand-Archive -Force pc_local\source.zip pc_local\buildsrc

          @'
          import ast, pathlib, re, textwrap

          root = pathlib.Path(r"pc_local\buildsrc")

          core_path = root / "core_local.py"
          s = core_path.read_text(encoding="utf-8")
          s = s.replace("APP_VERSION = '2.0.0'", "APP_VERSION = '2.0.5'")

          methods = """
          def _kill_stale_port(self):
              if os.name != 'nt':
                  return
              try:
                  flags = getattr(subprocess, 'CREATE_NO_WINDOW', 0)
                  r = subprocess.run(
                      ['netstat','-ano','-p','tcp'],
                      capture_output=True, text=True, errors='ignore',
                      creationflags=flags, timeout=8
                  )
                  pids = set()
                  for line in (r.stdout or '').splitlines():
                      cols = line.split()
                      if len(cols) >= 4 and cols[0].upper() == 'TCP':
                          local = cols[1]
                          pid = cols[-1]
                          if pid.isdigit() and local.endswith(':' + str(WUZ_PORT)) and (
                              local.startswith('127.0.0.1:') or
                              local.startswith('0.0.0.0:') or
                              local.startswith('[::]:')
                          ):
                              pids.add(pid)
                  for pid in pids:
                      subprocess.run(
                          ['taskkill','/F','/PID',pid],
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          creationflags=flags, timeout=8
                      )
                  if pids:
                      time.sleep(1.0)
              except Exception:
                  pass

          def start(self):
              with self.lock:
                  if self.process and self.process.poll() is None:
                      return
                  if not os.path.exists(self.exe):
                      raise RuntimeError('No se encontró el motor interno WuzAPI.')
                  self._kill_stale_port()
                  env = os.environ.copy()
                  env['WUZAPI_ADMIN_TOKEN'] = CFG['admin_token']
                  env['WEBHOOK_FORMAT'] = 'json'
                  env['TZ'] = 'America/Bogota'
                  args = [
                      self.exe, '-skipmedia', '-logtype', 'json',
                      '-address', '127.0.0.1', '-port', str(WUZ_PORT),
                      '-osname', APP_NAME, '-datadir', str(WUZ_DIR),
                      '-admintoken', CFG['admin_token']
                  ]
                  flags = getattr(subprocess, 'CREATE_NO_WINDOW', 0)
                  self.process = subprocess.Popen(
                      args, cwd=str(WUZ_DIR), env=env,
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      creationflags=flags
                  )
              self.wait_ready(30)
              code, _ = self.admin('GET', '/admin/users')
              if code == 401:
                  raise RuntimeError(
                      'El motor local rechazó la clave administrativa. '
                      'Cierra la aplicación y vuelve a abrirla.'
                  )
          """
          methods = textwrap.indent(textwrap.dedent(methods).strip() + "\n", "    ")
          s2, n = re.subn(
              r"    def start\(self\):\n.*?(?=\n    def stop\(self\):)",
              methods.rstrip(),
              s,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit("No se pudo reemplazar WuzAPI.start")
          compile(s2, str(core_path), 'exec')
          core_path.write_text(s2, encoding="utf-8")

          # Corrección multimedia v2.0.5:
          # WuzAPI bloquea URLs 127.0.0.1 en su cliente HTTP seguro (protección SSRF).
          # Los archivos locales se envían como data: URI con MIME real.
          s2 = core_path.read_text(encoding="utf-8")
          s2 = s2.replace(
              "import json, os, re, secrets, shutil, sqlite3, subprocess, sys, threading, time, urllib.error, urllib.parse, urllib.request, uuid, zipfile",
              "import base64, json, mimetypes, os, re, secrets, shutil, sqlite3, subprocess, sys, threading, time, urllib.error, urllib.parse, urllib.request, uuid, zipfile"
          )

          media_helpers = "def media_url(mid):\n    m=q('SELECT * FROM media WHERE id=?',(mid,),one=True)\n    if not m:\n        return ''\n    return f\"http://127.0.0.1:{LOCAL_PORT}/media/{int(mid)}/{urllib.parse.quote(Path(m['path']).name)}\"\n\ndef media_record(mid):\n    m=q('SELECT * FROM media WHERE id=?',(int(mid),),one=True)\n    if not m:\n        raise RuntimeError('Archivo de la biblioteca no encontrado')\n    p=Path(m['path'])\n    if not p.exists() or not p.is_file():\n        raise RuntimeError(f\"El archivo ya no existe en disco: {m.get('name') or p.name}\")\n    return m\n\ndef media_mime(mid):\n    m=media_record(mid)\n    p=Path(m['path'])\n    suffix=p.suffix.lower()\n    overrides={\n        '.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png',\n        '.webp':'image/webp','.gif':'image/gif',\n        '.mp4':'video/mp4','.m4v':'video/mp4','.mov':'video/quicktime',\n        '.webm':'video/webm',\n        '.mp3':'audio/mpeg','.wav':'audio/wav','.m4a':'audio/mp4',\n        '.ogg':'audio/ogg','.oga':'audio/ogg','.aac':'audio/aac',\n        '.flac':'audio/flac',\n        '.pdf':'application/pdf','.txt':'text/plain','.zip':'application/zip',\n        '.doc':'application/msword',\n        '.docx':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'\n    }\n    if suffix in overrides:\n        return overrides[suffix]\n    guessed,_=mimetypes.guess_type(m.get('name') or p.name)\n    if guessed:\n        return guessed\n    with open(p,'rb') as fh:\n        head=fh.read(32)\n    if head.startswith(b'\\x89PNG\\r\\n\\x1a\\n'):\n        return 'image/png'\n    if head.startswith(b'\\xff\\xd8\\xff'):\n        return 'image/jpeg'\n    if head.startswith((b'GIF87a',b'GIF89a')):\n        return 'image/gif'\n    if head.startswith(b'%PDF-'):\n        return 'application/pdf'\n    if head.startswith(b'ID3') or head[:2] in (b'\\xff\\xfb',b'\\xff\\xf3',b'\\xff\\xf2'):\n        return 'audio/mpeg'\n    if head.startswith(b'OggS'):\n        return 'audio/ogg'\n    if head.startswith(b'fLaC'):\n        return 'audio/flac'\n    if head.startswith(b'RIFF') and head[8:12]==b'WAVE':\n        return 'audio/wav'\n    if len(head)>=12 and head[4:8]==b'ftyp':\n        return 'video/mp4'\n    return 'application/octet-stream'\n\ndef media_name(mid):\n    m=media_record(mid)\n    return str(m.get('name') or Path(m['path']).name)\n\ndef media_data_uri(mid, expected_kind=''):\n    m=media_record(mid)\n    p=Path(m['path'])\n    mime=media_mime(mid)\n    expected=(expected_kind or '').lower()\n    if expected=='image' and not mime.startswith('image/'):\n        raise RuntimeError(f\"El archivo {media_name(mid)} no es una imagen válida\")\n    if expected=='video' and not mime.startswith('video/'):\n        raise RuntimeError(f\"El archivo {media_name(mid)} no es un video válido\")\n    if expected=='audio' and not mime.startswith('audio/'):\n        raise RuntimeError(f\"El archivo {media_name(mid)} no es un audio válido\")\n    try:\n        raw=p.read_bytes()\n    except MemoryError:\n        raise RuntimeError('El archivo es demasiado grande para prepararlo en memoria')\n    encoded=base64.b64encode(raw).decode('ascii')\n    return f\"data:{mime};base64,{encoded}\"\n"
          media_helpers = textwrap.dedent(media_helpers)

          s2, n = re.subn(
              r"def media_url\(mid\):\n.*?(?=\n\n\ndef schedules_for\(pid\):)",
              lambda _m: media_helpers.rstrip(),
              s2,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit("No se pudo parchear helpers de multimedia")

          action_block = "def action_media_value(self,a,kind=''):\n    if a.get('media_id'):\n        return media_data_uri(int(a['media_id']), kind)\n    return str(a.get('url') or '')\n\ndef action_media_mime(self,a):\n    if a.get('media_id'):\n        return media_mime(int(a['media_id']))\n    return str(a.get('mime_type') or '')\n\ndef action_media_name(self,a):\n    if a.get('file_name'):\n        return str(a.get('file_name'))\n    if a.get('media_id'):\n        return media_name(int(a['media_id']))\n    return 'archivo'\n\ndef execute_action(self,pid,token,route,phone,name,msg,a,rule_name,started):\n    delay=int(a.get('delay_ms') or 0)\n    if delay>0:\n        time.sleep(min(delay,3600000)/1000)\n    typ=str(a.get('type','')).lower().strip()\n    text=self.vars(a.get('text',a.get('caption','')),phone,name,msg)\n\n    if typ=='text':\n        path='/chat/send/text'\n        payload={'Phone':route,'Body':text}\n        timeout=90\n    elif typ=='image':\n        media=self.action_media_value(a,'image')\n        if not media:\n            raise RuntimeError('La acción de imagen no tiene archivo ni URL')\n        path='/chat/send/image'\n        payload={'Phone':route,'Image':media,'Caption':text}\n        mime=self.action_media_mime(a)\n        if mime:\n            payload['MimeType']=mime\n        timeout=180\n    elif typ=='video':\n        media=self.action_media_value(a,'video')\n        if not media:\n            raise RuntimeError('La acción de video no tiene archivo ni URL')\n        path='/chat/send/video'\n        payload={'Phone':route,'Video':media,'Caption':text}\n        mime=self.action_media_mime(a)\n        if mime:\n            payload['MimeType']=mime\n        timeout=360\n    elif typ=='audio':\n        media=self.action_media_value(a,'audio')\n        if not media:\n            raise RuntimeError('La acción de audio no tiene archivo ni URL')\n        path='/chat/send/audio'\n        payload={'Phone':route,'Audio':media,'PTT':False}\n        mime=self.action_media_mime(a)\n        if mime:\n            payload['mimetype']=mime\n        timeout=300\n    elif typ=='document':\n        media=self.action_media_value(a,'')\n        if not media:\n            raise RuntimeError('La acción de documento no tiene archivo ni URL')\n        path='/chat/send/document'\n        payload={'Phone':route,'Document':media,'FileName':self.action_media_name(a),'Caption':text}\n        mime=self.action_media_mime(a)\n        if mime:\n            payload['MimeType']=mime\n        timeout=360\n    elif typ=='sticker':\n        media=self.action_media_value(a,'image')\n        if not media:\n            raise RuntimeError('La acción de sticker no tiene archivo ni URL')\n        path='/chat/send/sticker'\n        payload={'Phone':route,'Sticker':media}\n        mime=self.action_media_mime(a)\n        if mime:\n            payload['MimeType']=mime\n        timeout=180\n    elif typ=='location':\n        path='/chat/send/location'\n        payload={'Phone':route,'Latitude':float(a.get('lat') or 0),'Longitude':float(a.get('lng') or 0),'Name':a.get('name') or 'Ubicación'}\n        timeout=90\n    elif typ=='contact':\n        n=str(a.get('name') or 'Contacto')\n        num=str(a.get('number') or '')\n        path='/chat/send/contact'\n        payload={'Phone':route,'Name':n,'Vcard':f'BEGIN:VCARD\\nVERSION:3.0\\nFN:{n}\\nTEL;TYPE=CELL:{num}\\nEND:VCARD'}\n        timeout=90\n    elif typ=='buttons':\n        path='/chat/send/buttons'\n        payload={'Phone':route,'Body':text,'Title':a.get('title',''),'Footer':a.get('footer',''),'Buttons':a.get('buttons',[])}\n        if a.get('image_media_id'):\n            payload['Image']=media_data_uri(int(a['image_media_id']),'image')\n        elif a.get('image_url'):\n            payload['Image']=a['image_url']\n        timeout=180\n    elif typ=='list':\n        path='/chat/send/list'\n        payload={'Phone':route,'Desc':text,'TopText':a.get('title',''),'FooterText':a.get('footer',''),'ButtonText':a.get('button_text') or 'Ver opciones','Sections':a.get('sections',[])}\n        timeout=90\n    else:\n        raise RuntimeError(f'Acción no soportada: {typ}')\n\n    c,j=WUZ.call(token,'POST',path,payload,timeout)\n    if c>=300 or (isinstance(j,dict) and j.get('success') is False):\n        err=(j.get('error') if isinstance(j,dict) else str(j)) or str(j)\n        raise RuntimeError(f'Error enviando {typ}: HTTP {c} · {err}')\n    log(pid,'info',f'Respuesta enviada en {int((time.perf_counter()-started)*1000)} ms · {rule_name} · {typ}')\n"
          action_block = textwrap.dedent(action_block)
          action_block = textwrap.indent(action_block, "    ")

          s2, n = re.subn(
              r"    def action_media_url\(self,a\):\n.*?(?=\n    def on_webhook\(self,pid,raw\):)",
              lambda _m: action_block.rstrip(),
              s2,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit("No se pudo parchear execute_action multimedia")

          # Servidor local: conservar MIME correcto para vista previa/diagnóstico.
          s2 = s2.replace(
              "self.send_response(200); self.send_header('Content-Type','application/octet-stream');self.send_header('Content-Length',str(size));self.end_headers()",
              "self.send_response(200); self.send_header('Content-Type',media_mime(mid));self.send_header('Content-Length',str(size));self.end_headers()"
          )

          compile(s2, str(core_path), 'exec')
          core_path.write_text(s2, encoding="utf-8")

          # Generar un bootstrap con los imports completos exactamente como
          # aparecen en core_local/gui_local. Esto conserva urllib.error,
          # urllib.parse, PIL.Image, tkinter.messagebox, etc.
          def import_statements(path):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              out = set()
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      try:
                          stmt = ast.unparse(node).strip()
                      except Exception:
                          continue
                      if "core_local" in stmt or "gui_local" in stmt:
                          continue
                      out.add(stmt)
              return out

          statements = import_statements(core_path) | import_statements(root / "gui_local.py")
          lines = ["# Auto-generado para PyInstaller; no editar."]
          for stmt in sorted(statements):
              lines.append("try:\n    " + stmt.replace("\n", "\n    ") + "\nexcept Exception:\n    pass")
          (root / "bootstrap_imports.py").write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Launcher robusto: core_local y gui_local se empaquetan como recursos físicos.
          main_path = root / "main_local.py"
          main = r'''import bootstrap_imports
          import ctypes, importlib.util, os, sys, threading

          _mutex = None

          def _resource(name):
              base = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(sys.argv[0])))
              return os.path.join(base, name)

          def _load_module(name):
              path = _resource(name + '.py')
              if not os.path.exists(path):
                  raise RuntimeError('Falta el componente interno ' + name + '.py')
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError('No se pudo cargar el componente interno ' + name)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          def _self_test():
              _load_module('core_local')
              _load_module('gui_local')
              return 0

          if '--self-test' in sys.argv:
              try:
                  sys.exit(_self_test())
              except Exception:
                  import tempfile, traceback
                  report = os.path.join(tempfile.gettempdir(), 'multibot-selftest.txt')
                  with open(report, 'w', encoding='utf-8') as fh:
                      traceback.print_exc(file=fh)
                  sys.exit(2)

          C = _load_module('core_local')
          G = _load_module('gui_local')

          def single_instance():
              global _mutex
              try:
                  _mutex = ctypes.windll.kernel32.CreateMutexW(
                      None, False, 'MonopolioMultiBotDesktop_v2_Mutex'
                  )
                  return ctypes.windll.kernel32.GetLastError() != 183
              except Exception:
                  return True

          def start_services(app):
              try:
                  C.start_services()
                  C.log('', 'info', 'Motor local iniciado correctamente')
              except Exception as e:
                  C.log('', 'error', f'No se pudo iniciar el motor: {e}')
                  from tkinter import messagebox
                  app.after(
                      0,
                      lambda: messagebox.showerror(
                          C.APP_NAME,
                          f'No se pudo iniciar el motor de WhatsApp:\n\n{e}'
                      )
                  )

          if __name__ == '__main__':
              if not single_instance():
                  sys.exit(0)
              app = G.App()
              threading.Thread(
                  target=start_services,
                  args=(app,),
                  daemon=True,
                  name='services'
              ).start()
              if '--background' in sys.argv:
                  app.withdraw()
              app.mainloop()
          '''
          main = textwrap.dedent(main)
          compile(main, str(main_path), 'exec')
          main_path.write_text(main, encoding='utf-8')

          iss_path = root / "installer.iss"
          t = iss_path.read_text(encoding="utf-8")
          t = t.replace('#define MyAppVersion "2.0.0"', '#define MyAppVersion "2.0.5"')
          t = t.replace(
              'OutputBaseFilename=MonopolioMultiBotDesktop_Setup_v2.0.0',
              'OutputBaseFilename=MonopolioMultiBotDesktop_Setup_v2.0.5'
          )
          t = t.replace('VersionInfoVersion=2.0.0.0', 'VersionInfoVersion=2.0.5.0')

          install_line = 'Filename: "{cmd}"; Parameters: "/C taskkill /F /IM MonopolioMultiBotHub.exe >nul 2>&1"; Flags: runhidden waituntilterminated'
          if 'Parameters: "/C taskkill /F /IM wuzapi.exe >nul 2>&1"; Flags: runhidden waituntilterminated' not in t:
              t = t.replace(
                  install_line,
                  install_line + '\n' +
                  'Filename: "{cmd}"; Parameters: "/C taskkill /F /IM wuzapi.exe >nul 2>&1"; Flags: runhidden waituntilterminated'
              )

          uninstall_line = 'Filename: "{cmd}"; Parameters: "/C taskkill /F /IM {#MyAppExeName} >nul 2>&1"; Flags: runhidden waituntilterminated; RunOnceId: "StopMultiBotDesktop"'
          if 'RunOnceId: "StopWuzAPI"' not in t:
              t = t.replace(
                  uninstall_line,
                  uninstall_line + '\n' +
                  'Filename: "{cmd}"; Parameters: "/C taskkill /F /IM wuzapi.exe >nul 2>&1"; Flags: runhidden waituntilterminated; RunOnceId: "StopWuzAPI"'
              )

          prep = "  Exec(ExpandConstant('{cmd}'), '/C taskkill /F /IM MonopolioMultiBotHub.exe >nul 2>&1', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);"
          if "taskkill /F /IM wuzapi.exe >nul 2>&1', '', SW_HIDE" not in t:
              t = t.replace(
                  prep,
                  prep + "\n" +
                  "  Exec(ExpandConstant('{cmd}'), '/C taskkill /F /IM wuzapi.exe >nul 2>&1', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);"
              )
          iss_path.write_text(t, encoding="utf-8")
          '@ | Set-Content patch_v205.py -Encoding UTF8
          python patch_v205.py

          @'
          import pathlib, re, textwrap

          root = pathlib.Path(r"pc_local\buildsrc")
          core_path = root / "core_local.py"
          gui_path = root / "gui_local.py"
          iss_path = root / "installer.iss"

          # ---------- CORE: contactos por negocio ----------
          s = core_path.read_text(encoding="utf-8")
          s = s.replace("APP_VERSION = '2.0.5'", "APP_VERSION = '2.0.6'")

          schema_tail = "          PRIMARY KEY(profile_id,msgid)\n        );\n        ''')"
          schema_repl = "          PRIMARY KEY(profile_id,msgid)\n        );\n        CREATE TABLE IF NOT EXISTS contacts(\n          id INTEGER PRIMARY KEY AUTOINCREMENT,\n          profile_id TEXT NOT NULL,\n          phone TEXT NOT NULL,\n          name TEXT NOT NULL DEFAULT '',\n          label TEXT NOT NULL DEFAULT '',\n          note TEXT NOT NULL DEFAULT '',\n          first_seen TEXT NOT NULL,\n          last_seen TEXT NOT NULL,\n          last_message TEXT NOT NULL DEFAULT '',\n          last_rule TEXT NOT NULL DEFAULT '',\n          interactions INTEGER NOT NULL DEFAULT 1,\n          UNIQUE(profile_id,phone)\n        );\n        CREATE INDEX IF NOT EXISTS idx_contacts_profile_name ON contacts(profile_id,name);\n        CREATE INDEX IF NOT EXISTS idx_contacts_profile_phone ON contacts(profile_id,phone);\n        ''')"
          if schema_tail not in s:
              raise SystemExit("No se encontró cierre dedupe para agregar contactos")
          s = s.replace(schema_tail,schema_repl,1)

          helper_marker = """def delete_schedule(sid): x('DELETE FROM schedules WHERE id=?',(sid,))


          def recent_logs(pid=None,limit=400):"""
          helpers = """def delete_schedule(sid): x('DELETE FROM schedules WHERE id=?',(sid,))


          def normalize_contact_phone(phone):
              return re.sub(r'\\D+','',str(phone or ''))


          def contacts_for(pid, search=''):
              term=str(search or '').strip()
              if term:
                  like=f'%{term}%'
                  return q(
                      'SELECT * FROM contacts WHERE profile_id=? AND '
                      '(name LIKE ? OR phone LIKE ? OR label LIKE ? OR note LIKE ?) '
                      'ORDER BY last_seen DESC,id DESC',
                      (pid,like,like,like,like)
                  )
              return q('SELECT * FROM contacts WHERE profile_id=? ORDER BY last_seen DESC,id DESC',(pid,))


          def get_contact(cid):
              return q('SELECT * FROM contacts WHERE id=?',(int(cid),),one=True)


          def save_customer_contact(profile_id, phone, name='', label='', note='', message='', rule_name=''):
              phone=normalize_contact_phone(phone)
              if not phone:
                  raise RuntimeError('No se pudo obtener el número del cliente para guardar el contacto.')
              now=datetime.now().isoformat(timespec='seconds')
              name=str(name or '').strip()
              label=str(label or '').strip()
              note=str(note or '').strip()
              message=str(message or '')[:500]
              rule_name=str(rule_name or '')[:200]
              existing=q('SELECT * FROM contacts WHERE profile_id=? AND phone=?',(profile_id,phone),one=True)
              if existing:
                  final_name=str(existing.get('name') or '') or name
                  final_label=str(existing.get('label') or '') or label
                  final_note=str(existing.get('note') or '') or note
                  x(
                      'UPDATE contacts SET name=?,label=?,note=?,last_seen=?,last_message=?,last_rule=?,'
                      'interactions=interactions+1 WHERE id=?',
                      (final_name,final_label,final_note,now,message,rule_name,int(existing['id']))
                  )
                  return int(existing['id']), False
              cid=x(
                  'INSERT INTO contacts(profile_id,phone,name,label,note,first_seen,last_seen,last_message,last_rule,interactions) '
                  'VALUES(?,?,?,?,?,?,?,?,?,1)',
                  (profile_id,phone,name,label,note,now,now,message,rule_name)
              )
              return int(cid), True


          def update_contact(cid, name, label='', note=''):
              x(
                  'UPDATE contacts SET name=?,label=?,note=? WHERE id=?',
                  (str(name or '').strip(),str(label or '').strip(),str(note or '').strip(),int(cid))
              )


          def delete_contact(cid):
