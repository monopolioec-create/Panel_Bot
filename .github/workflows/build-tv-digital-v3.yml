name: Build TV DIGITAL V3 debugged

on:
  push:
    branches:
      - ibo-ui-v3-brand-debug-20260921
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Restore Premium V2 source
        run: |
          mkdir -p /tmp/ibo_patch
          cat ibo_ui_v2/main2.b64.01 ibo_ui_v2/main2.b64.02 ibo_ui_v2/main2.b64.03 ibo_ui_v2/main2.b64.04 ibo_ui_v2/main2.b64.05 ibo_ui_v2/main2.b64.06a ibo_ui_v2/main2.b64.07 > /tmp/main.b64
          base64 -d /tmp/main.b64 > /tmp/MainActivity.java.gz
          gzip -t /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/MainActivity.java

          cat ibo_ui_v2/other2.b64.01 ibo_ui_v2/other2.b64.02 ibo_ui_v2/other2.b64.03 > /tmp/other.b64
          base64 -d /tmp/other.b64 > /tmp/other.tgz
          tar -tzf /tmp/other.tgz >/dev/null
          tar -xzf /tmp/other.tgz -C /tmp/ibo_patch
          cp /tmp/ibo_patch/AppPrefs.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/AppPrefs.java
          cp /tmp/ibo_patch/ImageLoader.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/ImageLoader.java
          cp /tmp/ibo_patch/XtreamApi.java ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo/XtreamApi.java
          cp /tmp/ibo_patch/build.gradle ibo_independent/android/app/build.gradle
          cp /tmp/ibo_patch/AndroidManifest.xml ibo_independent/android/app/src/main/AndroidManifest.xml

      - name: Apply TV DIGITAL V3 interaction and branding patch
        run: |
          cat ibo_ui_v3/v3diff.0 ibo_ui_v3/v3diff.1 ibo_ui_v3/v3diff.2 ibo_ui_v3/v3diff.3 > /tmp/v3.patch
          MAIN=ibo_independent/android/app/src/main/java/com/monopolio/mediaplayeribo
          (cd "$MAIN" && patch -p1 < /tmp/v3.patch)

          # Version / label. Exact logo is loaded from the panel URL on every branded screen.
          sed -i "s/versionCode 2/versionCode 3/" ibo_independent/android/app/build.gradle
          sed -i "s/versionName '2.0.0'/versionName '3.0.0'/" ibo_independent/android/app/build.gradle
          sed -i 's/android:label="MediaPlayerIbo"/android:label="TV DIGITAL"/' ibo_independent/android/app/src/main/AndroidManifest.xml

          # Add test configuration/dependencies only if not already present.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ibo_independent/android/app/build.gradle')
          s=p.read_text()
          if 'testOptions {' not in s:
              s=s.replace('buildFeatures { buildConfig true }', 'buildFeatures { buildConfig true }\n    testOptions { unitTests.includeAndroidResources = true }')
          if "testImplementation 'junit:junit:4.13.2'" not in s:
              s=s.replace("\n}", "\n    testImplementation 'junit:junit:4.13.2'\n    testImplementation 'org.robolectric:robolectric:4.13.2'\n}", 1) if 'dependencies {' in s else s
              if "testImplementation 'junit:junit:4.13.2'" not in s:
                  s=s.replace("    implementation 'androidx.media3:media3-ui:1.5.1'\n}", "    implementation 'androidx.media3:media3-ui:1.5.1'\n    testImplementation 'junit:junit:4.13.2'\n    testImplementation 'org.robolectric:robolectric:4.13.2'\n}")
          p.write_text(s)
          PY

          # Static audit: every interactive adapter must have its own action binding.
          grep -q 'wireAction(b,s.action)' "$MAIN/MainActivity.java"
          grep -q 'wireAction(box,()->' "$MAIN/MainActivity.java"
          grep -q 'wireAction(row,()->playLive' "$MAIN/MainActivity.java"
          grep -q 'selectedCategory=x.id;refreshSectionItems' "$MAIN/MainActivity.java"
          grep -q 'KEYCODE_DPAD_CENTER' "$MAIN/MainActivity.java"
          grep -q 'KEYCODE_BUTTON_A' "$MAIN/MainActivity.java"
          grep -q 'https://ap24.top/ibo/tv_digital_logo.png' "$MAIN/MainActivity.java"
          test "$(grep -c 'new SettingItem' "$MAIN/MainActivity.java")" -ge 15

      - name: Create interaction tests
        run: |
          TEST=ibo_independent/android/app/src/test/java/com/monopolio/mediaplayeribo
          mkdir -p "$TEST"
          cat > "$TEST/UiActionBindingTest.java" <<'EOF'
          package com.monopolio.mediaplayeribo;

          import static org.junit.Assert.assertEquals;
          import static org.junit.Assert.assertTrue;
          import android.content.Context;
          import android.view.KeyEvent;
          import android.widget.TextView;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.robolectric.RobolectricTestRunner;
          import org.robolectric.RuntimeEnvironment;
          import java.util.concurrent.atomic.AtomicInteger;

          @RunWith(RobolectricTestRunner.class)
          public class UiActionBindingTest {
              @Test public void clickTriggersAction() {
                  Context c = RuntimeEnvironment.getApplication();
                  TextView v = new TextView(c);
                  AtomicInteger count = new AtomicInteger();
                  MainActivity.wireAction(v, count::incrementAndGet);
                  assertTrue(v.performClick());
                  assertEquals(1, count.get());
              }
              @Test public void remoteKeysAreWired() {
                  Context c = RuntimeEnvironment.getApplication();
                  TextView v = new TextView(c);
                  AtomicInteger count = new AtomicInteger();
                  MainActivity.wireAction(v, count::incrementAndGet);
                  v.requestFocus();
                  boolean center = v.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_CENTER));
                  boolean enter = v.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER));
                  boolean gamepad = v.dispatchKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_BUTTON_A));
                  assertTrue(center || enter || gamepad);
                  assertTrue(count.get() >= 1);
              }
          }
          EOF

          cat > "$TEST/AppPrefsTest.java" <<'EOF'
          package com.monopolio.mediaplayeribo;

          import static org.junit.Assert.*;
          import android.content.Context;
          import org.junit.Before;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.robolectric.RobolectricTestRunner;
          import org.robolectric.RuntimeEnvironment;
          import java.util.Arrays;
          import java.util.LinkedHashSet;

          @RunWith(RobolectricTestRunner.class)
          public class AppPrefsTest {
              private AppPrefs prefs;
              @Before public void setUp() {
                  Context c=RuntimeEnvironment.getApplication();
                  c.getSharedPreferences("ibo_prefs_v2",Context.MODE_PRIVATE).edit().clear().commit();
                  prefs=new AppPrefs(c);
              }
              @Test public void settingsPersist() {
                  prefs.language("en"); prefs.theme("gold"); prefs.liveFormat("m3u8");
                  prefs.liveOrder("name"); prefs.mediaSort("rating"); prefs.playerMode("auto");
                  prefs.autoPreview(true); prefs.timeFormat("12"); prefs.subtitles(false);
                  prefs.subtitleSize("large"); prefs.deviceType("tv"); prefs.parentalEnabled(true);
                  prefs.parentalPin("4321");
                  prefs.hiddenCategories("live",new LinkedHashSet<>(Arrays.asList("10","20")));
                  assertEquals("en",prefs.language()); assertEquals("gold",prefs.theme());
                  assertEquals("m3u8",prefs.liveFormat()); assertEquals("name",prefs.liveOrder());
                  assertEquals("rating",prefs.mediaSort()); assertEquals("auto",prefs.playerMode());
                  assertTrue(prefs.autoPreview()); assertEquals("12",prefs.timeFormat());
                  assertFalse(prefs.subtitles()); assertEquals("large",prefs.subtitleSize());
                  assertEquals("tv",prefs.deviceType()); assertTrue(prefs.parentalEnabled());
                  assertEquals("4321",prefs.parentalPin());
                  assertTrue(prefs.hiddenCategories("live").contains("10"));
              }
              @Test public void favoritesAndResumeWork() {
                  prefs.toggleFavorite("movie","55"); assertTrue(prefs.isFavorite("movie","55"));
                  prefs.addRecent("movie","1"); prefs.saveResume("movie","1",15000L);
                  assertEquals(15000L,prefs.resume("movie","1"));
                  prefs.clearRecent("movie"); assertEquals(0L,prefs.resume("movie","1"));
              }
          }
          EOF

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: ibo_independent/android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: ibo_independent/android
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build APK
        working-directory: ibo_independent/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          cp ibo_independent/android/app/build/outputs/apk/debug/app-debug.apk TV_DIGITAL_Premium_V3.apk
          unzip -t TV_DIGITAL_Premium_V3.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TV_DIGITAL_Premium_V3.apk | head -12
          sha256sum TV_DIGITAL_Premium_V3.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TV_DIGITAL_Premium_V3_APK
          path: TV_DIGITAL_Premium_V3.apk
          if-no-files-found: error
