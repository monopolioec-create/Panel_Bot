name: Build Windows MultiBot Hub

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc_hub/source.b64'
      - '.github/workflows/build-pc-hub.yml'

permissions:
  contents: read

env:
  WUZAPI_COMMIT: 5f0350f3af2abf6900739cc8e23b55700510451d

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Decode source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force pc_hub\buildsrc | Out-Null
          $b64 = Get-Content pc_hub\source.b64 -Raw
          [IO.File]::WriteAllBytes("pc_hub\source.zip",[Convert]::FromBase64String($b64))
          Expand-Archive -Force pc_hub\source.zip pc_hub\buildsrc
          $raw = [IO.File]::ReadAllBytes("pc_hub\buildsrc\hub.py")
          $utf8 = New-Object System.Text.UTF8Encoding($false,$true)
          try { $text = $utf8.GetString($raw) } catch { $text = [Text.Encoding]::GetEncoding(1252).GetString($raw) }
          [IO.File]::WriteAllText("pc_hub\buildsrc\hub.py",$text,(New-Object System.Text.UTF8Encoding($false)))

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build WuzAPI Windows
        shell: powershell
        run: |
          git clone https://github.com/asternic/wuzapi.git $env:TEMP\wuzapi
          Set-Location $env:TEMP\wuzapi
          git checkout $env:WUZAPI_COMMIT
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -trimpath -ldflags="-s -w" -o "$env:GITHUB_WORKSPACE\pc_hub\buildsrc\wuzapi.exe" .
          Get-Item "$env:GITHUB_WORKSPACE\pc_hub\buildsrc\wuzapi.exe"

      - name: Build Hub EXE
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_hub\buildsrc"
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --noconsole --name MonopolioMultiBotHub --add-binary "wuzapi.exe;." hub.py
          Get-Item dist\MonopolioMultiBotHub.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\pc_hub\buildsrc"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Get-Item output\MonopolioMultiBotHub_Setup_v1.0.0.exe
          Get-FileHash output\MonopolioMultiBotHub_Setup_v1.0.0.exe -Algorithm SHA256 | Format-List

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: MonopolioMultiBotHub-Windows
          path: pc_hub/buildsrc/output/MonopolioMultiBotHub_Setup_v1.0.0.exe
          retention-days: 30
