name: Build Monopoly Records Bot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: mrbot-apk-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  WUZAPI_COMMIT: 919c72c9750b2a1eedf0fcf9c9592f05fe46f61c
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35 + NDK r29
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Go 1.25.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Build WuzAPI for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/asternic/wuzapi.git /tmp/wuzapi
          cd /tmp/wuzapi
          git checkout "$WUZAPI_COMMIT"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC" go build -trimpath -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libwuzapi.so" .
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libwuzapi.so"
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libwuzapi.so"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MonopolyRecordsBot-Samsung-A56.apk
          sha256sum app/build/outputs/apk/debug/MonopolyRecordsBot-Samsung-A56.apk | tee app/build/outputs/apk/debug/MonopolyRecordsBot-Samsung-A56.apk.sha256
          ls -lh app/build/outputs/apk/debug/MonopolyRecordsBot-Samsung-A56.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonopolyRecordsBot-Samsung-A56
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/MonopolyRecordsBot-Samsung-A56.apk
            app/build/outputs/apk/debug/MonopolyRecordsBot-Samsung-A56.apk.sha256
          retention-days: 30
